schema_version = "1.4"
artifacts = ["/app/answer.json"]

[task]
name = "Nandinitalwar/transit-timing"
version = "1.0.0"
description = "Schedule symbolic transit tasks for maximum timing reward."
keywords = ["reinforcement-learning", "reasoning", "scheduling", "astrology"]

[[task.authors]]
name = "Nandinitalwar"

[metadata]
category = "optimal-stopping"
difficulty = "medium"
reward_type = "deterministic"

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 300.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 512
storage_mb = 1024
