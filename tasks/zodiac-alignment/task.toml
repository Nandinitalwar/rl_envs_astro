schema_version = "1.4"
artifacts = ["/app/answer.json"]

[task]
name = "Nandinitalwar/zodiac-alignment"
version = "1.0.0"
description = "Solve a symbolic zodiac alignment episode with a minimal action sequence."
keywords = ["reinforcement-learning", "reasoning", "planning", "astrology"]

[[task.authors]]
name = "Nandinitalwar"

[metadata]
category = "symbolic-planning"
difficulty = "easy"
