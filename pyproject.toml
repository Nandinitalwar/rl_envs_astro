[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rl-envs-astro"
version = "0.1.0"
description = "Harbor and Gymnasium reinforcement-learning tasks with symbolic astrology themes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "rl-envs-astro contributors" },
]
dependencies = [
  "gymnasium>=1.0,<2",
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rl_envs_astro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
